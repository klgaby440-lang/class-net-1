[package]
name = "classnet-app"
version = "1.4.0"
description = "Logiciel de gestion scolaire ClassNet"
authors = ["CRYPT Enterprise"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "shell-open" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
